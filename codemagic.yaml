workflows:
  android:
    name: Fake Call APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project and add native code
        script: |
          flutter create --platforms=android --org com.example --project-name fakecall .
          mkdir -p android/app/src/main/kotlin/com/example/fakecall
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cp -f native/*.kt android/app/src/main/kotlin/com/example/fakecall/
          cp -f native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -f native/accessibility_config.xml android/app/src/main/res/xml/accessibility_config.xml
          cp -f native/fakecall_strings.xml android/app/src/main/res/values/fakecall_strings.xml
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
